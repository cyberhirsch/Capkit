name: Build Capkit for macOS

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (macOS arm64)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build native bridge
        run: native/macos/build.sh native/macos/build

      - name: Build
        run: dotnet build Capkit/Capkit.csproj -c Debug -p:CapkitPlatform=macos -r osx-arm64

      - name: Platform smoke test
        run: dotnet run --project tests/Capkit.PlatformSmoke -c Debug -p:CapkitPlatform=macos -r osx-arm64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Capkit-macos-arm64
          path: Capkit/bin/Debug/osx-arm64
          if-no-files-found: error

      - name: Launch test
        run: |
          # Run a copy in portable mode so the test config and logs stay inside the job folder.
          rm -rf "$RUNNER_TEMP/launch" && cp -R Capkit/bin/Debug/osx-arm64 "$RUNNER_TEMP/launch"
          cd "$RUNNER_TEMP/launch"
          touch Portable
          mkdir -p "Capkit Data"
          echo '{ "ShowStartScreen": false }' > "Capkit Data/ApplicationConfig.json"

          ./Capkit > launch-output.txt 2>&1 &
          pid=$!
          sleep 25
          screencapture -x launch-screen.png || echo "screencapture failed"

          if kill -0 "$pid" 2>/dev/null; then
            alive=1
            echo "Capkit is still running after 25 s."
            kill "$pid"
          else
            alive=0
            code=0; wait "$pid" || code=$?; echo "Capkit exited early with code $code."
          fi

          echo "::group::Console output"; cat launch-output.txt; echo "::endgroup::"
          log=$(find "Capkit Data/Logs" -type f -name '*.txt' 2>/dev/null | head -1)
          echo "::group::Capkit log"; [ -n "$log" ] && cat "$log" || echo "No log file written."; echo "::endgroup::"

          test "$alive" = 1
          test -n "$log" && grep -q "Startup time" "$log"

      - name: Upload launch results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Capkit-macos-launch
          path: |
            ${{ runner.temp }}/launch/launch-output.txt
            ${{ runner.temp }}/launch/launch-screen.png
            ${{ runner.temp }}/launch/Capkit Data/Logs
          if-no-files-found: warn

  package:
    name: Package Capkit.app (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build native bridge
        run: native/macos/build.sh native/macos/build

      - name: Publish
        run: |
          dotnet publish Capkit/Capkit.csproj -c Release -p:CapkitPlatform=macos -r osx-${{ matrix.arch }} \
            --self-contained true -o "$RUNNER_TEMP/publish"

      - name: Create Capkit.app
        run: |
          version=$(dotnet msbuild Capkit/Capkit.csproj -getProperty:Version -p:CapkitPlatform=macos)
          native/macos/package-app.sh "$RUNNER_TEMP/publish" "$RUNNER_TEMP/app" "$version"
          du -sh "$RUNNER_TEMP/app/Capkit.app"

      - name: Launch Capkit.app
        if: matrix.arch == 'arm64'
        run: |
          data="$HOME/Library/Application Support/Capkit"
          mkdir -p "$data"
          echo '{ "ShowStartScreen": false }' > "$data/ApplicationConfig.json"

          open "$RUNNER_TEMP/app/Capkit.app"
          sleep 25
          screencapture -x "$RUNNER_TEMP/app-screen.png" || true

          pgrep -x Capkit > /dev/null && echo "Capkit.app is running." || { echo "Capkit.app is not running."; exit_code=1; }
          pkill -x Capkit || true

          log=$(find "$data/Logs" -type f -name '*.txt' 2>/dev/null | head -1)
          echo "::group::Capkit log"; [ -n "$log" ] && cat "$log" || echo "No log file written."; echo "::endgroup::"
          test -z "${exit_code:-}"
          grep -q "Startup time" "$log"
          ! grep -q "Exception" "$log"

      - name: Zip
        run: |
          cd "$RUNNER_TEMP/app"
          ditto -c -k --sequesterRsrc --keepParent Capkit.app "$RUNNER_TEMP/Capkit-macos-${{ matrix.arch }}.zip"

      - name: Upload Capkit.app
        uses: actions/upload-artifact@v4
        with:
          name: Capkit-app-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/Capkit-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload launch screenshot
        if: always() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: Capkit-app-launch-screen
          path: ${{ runner.temp }}/app-screen.png
          if-no-files-found: warn
